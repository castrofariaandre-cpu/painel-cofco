<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error-bg: #fdecea;
    --error-text: #b3261e;
    --success-bg: #e8f5e9;
    --success-text: #1e7e34;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #3a3a3c;
      --error-bg: #3a1f1f;
      --error-text: #ff6b6b;
      --success-bg: #1c3a24;
      --success-text: #5fd77c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: transparent;
    color: var(--text);
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .link-row {
    margin-top: 16px;
    text-align: center;
    font-size: 0.85rem;
  }
  .link-row a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
  }
  .link-row a:hover { text-decoration: underline; }
  .message {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
  .message.error { display: block; background: var(--error-bg); color: var(--error-text); }
  .message.success { display: block; background: var(--success-bg); color: var(--success-text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <!-- Login form -->
  <div id="view-login">
    <h1>Entrar</h1>
    <p class="subtitle">Use o e-mail e senha que voc&ecirc; recebeu no convite.</p>
    <div id="login-message" class="message"></div>
    <form id="login-form">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" autocomplete="email" required />
      <label for="login-password">Senha</label>
      <input id="login-password" type="password" autocomplete="current-password" required />
      <button type="submit" id="login-submit">Entrar</button>
    </form>
    <div class="link-row"><a id="show-forgot">Esqueci minha senha</a></div>
  </div>

  <!-- Forgot password form -->
  <div id="view-forgot" hidden>
    <h1>Redefinir senha</h1>
    <p class="subtitle">Enviaremos um link para redefinir sua senha.</p>
    <div id="forgot-message" class="message"></div>
    <form id="forgot-form">
      <label for="forgot-email">E-mail</label>
      <input id="forgot-email" type="email" autocomplete="email" required />
      <button type="submit" id="forgot-submit">Enviar link</button>
    </form>
    <div class="link-row"><a id="show-login">Voltar para o login</a></div>
  </div>

  <!-- Set / reset password (reached via invite or recovery email link) -->
  <div id="view-set-password" hidden>
    <h1>Defina sua senha</h1>
    <p class="subtitle">Crie uma senha para acessar sua conta.</p>
    <div id="set-password-message" class="message"></div>
    <form id="set-password-form">
      <label for="new-password">Nova senha</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="6" required />
      <label for="new-password-confirm">Confirme a senha</label>
      <input id="new-password-confirm" type="password" autocomplete="new-password" minlength="6" required />
      <button type="submit" id="set-password-submit">Salvar senha</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const APP_URL = new URL("app.html", window.location.href).toString();

  const views = {
    login: document.getElementById("view-login"),
    forgot: document.getElementById("view-forgot"),
    setPassword: document.getElementById("view-set-password"),
  };
  function showView(name) {
    for (const key in views) views[key].hidden = key !== name;
  }
  function showMessage(el, text, type) {
    el.textContent = text;
    el.className = "message " + type;
  }

  // If Supabase redirected back here with a recovery/invite token in the URL,
  // it fires PASSWORD_RECOVERY once the session is established from the link.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      showView("setPassword");
    } else if (event === "SIGNED_IN" && !window.location.hash.includes("type=recovery")) {
      window.location.href = APP_URL;
    }
  });

  // If already logged in (and not in the middle of a recovery flow), skip straight to the app.
  (async () => {
    if (window.location.hash.includes("type=recovery")) return;
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) window.location.href = APP_URL;
  })();

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const btn = document.getElementById("login-submit");
    const msg = document.getElementById("login-message");
    msg.className = "message";
    btn.disabled = true;
    btn.textContent = "Entrando...";
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = "Entrar";
    if (error) {
      showMessage(msg, "E-mail ou senha inválidos.", "error");
    } else {
      window.location.href = APP_URL;
    }
  });

  document.getElementById("show-forgot").addEventListener("click", () => showView("forgot"));
  document.getElementById("show-login").addEventListener("click", () => showView("login"));

  document.getElementById("forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("forgot-email").value.trim();
    const btn = document.getElementById("forgot-submit");
    const msg = document.getElementById("forgot-message");
    btn.disabled = true;
    btn.textContent = "Enviando...";
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname,
    });
    btn.disabled = false;
    btn.textContent = "Enviar link";
    if (error) {
      showMessage(msg, error.message, "error");
    } else {
      showMessage(msg, "Se o e-mail existir, um link foi enviado.", "success");
    }
  });

  document.getElementById("set-password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("new-password").value;
    const confirm = document.getElementById("new-password-confirm").value;
    const msg = document.getElementById("set-password-message");
    if (password !== confirm) {
      showMessage(msg, "As senhas não coincidem.", "error");
      return;
    }
    const btn = document.getElementById("set-password-submit");
    btn.disabled = true;
    btn.textContent = "Salvando...";
    const { error } = await supabaseClient.auth.updateUser({ password });
    btn.disabled = false;
    btn.textContent = "Salvar senha";
    if (error) {
      showMessage(msg, error.message, "error");
    } else {
      window.location.href = APP_URL;
    }
  });
</script>
</body>
</html>
