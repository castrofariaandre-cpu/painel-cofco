<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acesso</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header span { color: var(--muted); font-size: 0.9rem; }
  button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
  }
  main {
    max-width: 720px;
    margin: 48px auto;
    padding: 0 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
</style>
</head>
<body>
<header>
  <strong>Painel</strong>
  <div>
    <span id="user-email"></span>
    <button id="logout-btn" style="margin-left: 12px;">Sair</button>
  </div>
</header>
<main>
  <div class="card">
    <h1 id="status-title">Verificando acesso&hellip;</h1>
    <p id="status-text">Aguarde um instante.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const LOGIN_URL = new URL("index.html", window.location.href).toString();
  const ADMIN_URL = new URL("admin.html", window.location.href).toString();

  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    const session = data.session;
    if (!session) {
      window.location.href = LOGIN_URL;
      return;
    }
    document.getElementById("user-email").textContent = session.user.email;

    if (session.user.email === ADMIN_EMAIL) {
      window.location.href = ADMIN_URL;
      return;
    }

    const { data: profile, error } = await supabaseClient
      .from("profiles")
      .select("unit")
      .eq("id", session.user.id)
      .single();

    const page = !error && profile && UNIT_PAGES[profile.unit];
    if (page) {
      window.location.href = new URL(page, window.location.href).toString();
      return;
    }

    document.getElementById("status-title").textContent = "Aguardando liberação";
    document.getElementById("status-text").textContent =
      "Sua conta ainda não tem uma unidade associada. Fale com o administrador para liberar seu acesso.";
  })();

  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") window.location.href = LOGIN_URL;
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
</script>
</body>
</html>
